dataloader_args:
  batch_size: 4
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 6

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 48000
  noise_prob: 0
  cues:
    audio:
      use: true
      required: true
  cue_processing:
    audio:
      reverb_enroll_prob: 0
      noise_enroll_prob: 0

enable_amp: false
exp_dir: exp/DPCCN
gpus: [0]
log_batch_interval: 100

loss:
  - type: SISDR
    output: speech
    target: wav_target
    weight: 1.0
    stages: [train, val]

model:
  tse_model: TSE_DPCCN_SPK
model_args:
  tse_model:
    separator:
      win: 512
      stride: 128
      nspk: 1
      tcn_layers: 2
      tcn_blocks: 10
      pool_sizes: [4, 8, 16, 32]
      causal: false  # false | true
    speaker:
      features:
        spkemb:
          enabled: true
          input: waveform  # waveform | embedding
          fusion: multiply  # additive | concat | multiply | FiLM
      speaker_model:
        fbank:
          num_mel_bins: 80
          frame_shift: 10
          frame_length: 25
          dither: 1.0
          sample_rate: *sr
        speaker_encoder:
          model: ECAPA_TDNN_GLOB_c512
          pretrained: ./wespeaker_models/voxceleb_ECAPA512/avg_model.pt
          spk_args:
            embed_dim: 192
            feat_dim: 80
            pooling_func: ASTP

model_init:
  tse_model: null

num_avg: 5
num_epochs: 150

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001
    weight_decay: 0.0001

clip_grad: 5.0
save_epoch_interval: 0

scheduler:
  tse_model:
    warmup:
      enabled: false
      by: epoch
      epochs: 0
      start_factor: 0.0
    name: PlateauHalf
    interval: validation
    args:
      patience: 3
      early_stop_patience: 7
      factor: 0.5
      min_delta: 0.0
      min_lr: 2.5e-05
      early_stop: true

seed: 42
