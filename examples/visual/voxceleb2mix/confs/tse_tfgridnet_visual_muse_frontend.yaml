dataloader_args:
  batch_size: 2
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 2

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 48000
  chunk_random_start: True
  chunk_short_policy: keep
  noise_prob: 0
  noise_lmdb_file: ./data/musan/lmdb
  cues:
    visual:
      use: true
      required: true
  cue_processing:
    visual:

val_dataset_args:
  collate:
    wav_mix:
      align: min
    wav_target:
      align: min
    visual_aux:
      align: min

enable_amp: false
exp_dir: exp/TFGridNet_VISUAL
gpus: [0]
log_batch_interval: 100

loss:
  - type: SISDR
    output: speech
    target: wav_target
    weight: 1.0
    stages: [train, val]

model:
  tse_model: TSE_TFGRIDNET_VISUAL
model_args:
  tse_model:
    separator:
      n_fft: 256
      stride: 128
      channels: 1
      n_layers: 6
      hidden_channels: 192
      n_head: 4
      approx_qk_dim: 512
      emb_dim: 48
      emb_ks: 4
      emb_hs: 1
      eps: 1.0e-5
      causal: false
      estimation: spec
      reference_channel: 0
      attention_context: null
      attention_output_norm: channel
      nspk: 1
    visual:
      features:
        muse_visual:
          enabled: true
          input: muse_frontend
          vf_pretrained: ./pretrain_networks/visual_frontend.pt
          freeze_frontend: true
          upsample: true
          fusion: concat
          multi_fuse: False
          ### Direct adapter: 512 -> 512
          adapter:
            type: direct
            input_dim: 512
            output_dim: 512
          ### MuSE adapter: 512 -> 512
          # adapter:
          #   type: muse
          #   input_dim: 512
          #   output_dim: 512
          #   num_layers: 5
          ### ClearerVoice adapter: 512 -> 256, then 256 -> 512 -> 256
          # adapter:
          #   type: clearer
          #   input_dim: 512
          #   output_dim: 256
          #   hidden_dim: 512
          #   num_layers: 5

model_init:
  tse_model: null

num_avg: 10
num_epochs: 150
clip_grad: 5.0
save_epoch_interval: 1

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001

scheduler:
  tse_model:
    # name: ExponentialDecrease
    # interval: step
    # args:
    #   final_lr: 2.5e-05
  ######## Fiexed LR Scheduler ########
    # name: none
  ######## Plateau Scheduler ########
    name: PlateauHalf
    interval: validation
    args:
      patience: 3
      factor: 0.5
      min_delta: 0.0
      min_lr: 0.0
      early_stop_patience: 6
      early_stop: true

seed: 42
