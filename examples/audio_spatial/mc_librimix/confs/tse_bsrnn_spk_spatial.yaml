dataloader_args:
  batch_size: 12    #A100_40g: 6; A100_80g: 12
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 2

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 48000
  noise_prob: 0
  noise_lmdb_file: ./data/musan/lmdb
  cues:
    audio:
      use: true
      required: true
    spatial:
      use: true
      required: true
  cue_processing:
    audio:
      reverb_enroll_prob: 0
      noise_enroll_prob: 0
    spatial:

val_dataset_args:
  collate:
    wav_mix:
      align: min
    wav_target:
      align: min

enable_amp: false
exp_dir: exp/TSE_BSRNN_SPK_SPATIAL
gpus: [0, 1]
log_batch_interval: 100

loss:
  - type: SISDR
    output: speech
    target: wav_target
    weight: 1.0
    stages: [train, val]

model:
  tse_model: TSE_BSRNN_SPK_SPATIAL
model_args:
  tse_model:
    separator:
      sr: *sr
      win: 512
      stride: 128
      channels: 4
      reference_channel: 0
      feature_dim: 128
      num_repeat: 6
      causal: false  # false | true
      nspk: 1
    speaker:
      features:
        tfmap:
          enabled: true
          type: spec
        context:
          enabled: true
          speaker_model:
          embed_dim: 512
          atten_dim: 128
          num_heads: 2
          fusion: multiply  # additive | concat | multiply | FiLM
        spkemb:
          enabled: false
          input: waveform  # waveform | embedding
          speaker_model:
          fusion: multiply  # additive | concat | multiply | FiLM
      speaker_model:
        fbank:
          num_mel_bins: 80
          frame_shift: 10
          frame_length: 25
          dither: 1.0
          sample_rate: *sr
        speaker_encoder:
          model: ECAPA_TDNN_GLOB_c512
          pretrained: ./wespeaker_models/voxceleb_ECAPA512/avg_model.pt
          spk_args:
            embed_dim: 192
            feat_dim: 80
            pooling_func: ASTP
    spatial:
      input_fields: [azimuth, elevation]
      array:
        mic_positions:
          - [0.02285, 0.02285, 0.0]
          - [-0.02285, 0.02285, 0.0]
          - [-0.02285, -0.02285, 0.0]
          - [0.02285, -0.02285, 0.0]
      pairs:
        - [0, 1]
        - [1, 2]
        - [2, 3]
        - [0, 3]
      features:
        ipd:
          enabled: true
        cdf:
          enabled: true
        sdf:
          enabled: true
        delta_stft:
          enabled: true
        # Supported but not yet validated for combined-cue training.
        cyc_doaemb:
          enabled: false
          alpha: 20
          encoding_dim: 40
          use_elevation: true
          fusion: multiply  # additive | concat | multiply | FiLM
        # Supported but not yet validated for combined-cue training.
        initstate_emb:
          enabled: false
          alpha: 20
          encoding_dim: 40
          use_elevation: true

find_unused_parameters: false

model_init:
  tse_model: null

num_avg: 5
num_epochs: 150

clip_grad: 5.0
save_epoch_interval: 10

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001
    weight_decay: 0.0001

scheduler:
  tse_model:
    name: ExponentialDecrease
    interval: step
    args:
      final_lr: 2.5e-05

seed: 42
