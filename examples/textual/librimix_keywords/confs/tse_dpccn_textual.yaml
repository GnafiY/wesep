# batch_size = 18 + chunk_len = 128000 + enable_amp = True:  A100 76G/80G
dataloader_args:
  batch_size: 18
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 6

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 128000 # 8 seconds at 16 kHz
  # whole_utt: true
  filter_len: false
  cues:
    textual:
      use: true
      required: true

enable_amp: true
exp_dir: exp/TSE_DPCCN_TEXTUAL_KEYWORDS
gpus: [0]
log_batch_interval: 100

loss:
  - type: SISDR
    output: speech
    target: wav_target
    weight: 1.0
    stages: [train, val]

model:
  tse_model: TSE_DPCCN_TEXTUAL
model_args:
  tse_model:
    separator:
      win: 512
      stride: 128
      nspk: 1
      tcn_layers: 2
      tcn_blocks: 10
      pool_sizes: [4, 8, 16, 32]
      causal: false
    textual:
      features:
        dae_kce:
          enabled: true
          padding_id: 0
          bos_id: 71
          eos_id: 72
          # Data preparation and direct text inference share these resources.
          tokenizer:
            phoneme_map: ./exp/kce/phoneme2int.txt
            lexicon: ./exp/kce/word2lexicon.txt
          adapter:
            output_dim: 128
            num_layers: 3
          fusion: FiLM  # additive | concat | multiply | FiLM
          multi_fuse: false
          # Download from https://huggingface.co/GnafiY/DAE-TSE and keep
          # model.yaml and data.yaml beside the pretrained checkpoint.
          pretrained: ./exp/kce/epoch_149.pt

model_init:
  tse_model: null

num_avg: 5
num_epochs: 150

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001
    weight_decay: 0.0001

clip_grad: 5.0
save_epoch_interval: 0

scheduler:
  tse_model:
    warmup:
      enabled: false
      by: epoch
      epochs: 0
      start_factor: 0.0
    name: PlateauHalf
    interval: validation
    args:
      patience: 3
      early_stop_patience: 7
      factor: 0.5
      min_delta: 0.0
      min_lr: 2.5e-05
      early_stop: true

seed: 42
